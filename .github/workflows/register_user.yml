name: Register User

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email užívateľa'
        required: true
      typ_org:
        description: 'Typ organizácie'
        required: true
      oblasti:
        description: 'Oblasti záujmu (JSON array)'
        required: true
      kw_custom:
        description: 'Vlastné kľúčové slová (JSON array)'
        required: false
        default: '[]'
      interval:
        description: 'Interval posielania'
        required: false
        default: 'pondelok'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Register user
        run: |
          python3 << 'PYEOF'
          import json, os
          from datetime import datetime

          SUBOR  = "users.json"
          email     = os.environ['INPUT_EMAIL'].strip().lower()
          typ_org   = os.environ['INPUT_TYP_ORG']
          oblasti   = json.loads(os.environ['INPUT_OBLASTI'])
          kw_custom = json.loads(os.environ['INPUT_KW_CUSTOM'])
          interval  = os.environ['INPUT_INTERVAL']

          if os.path.exists(SUBOR):
              with open(SUBOR, 'r') as f:
                  users = json.load(f)
          else:
              users = []

          existujuci = next((u for u in users if u['email'] == email), None)
          if existujuci:
              existujuci.update({
                  'typ_org': typ_org, 'oblasti': oblasti,
                  'kw_custom': kw_custom, 'interval': interval,
                  'updated': datetime.now().strftime('%Y-%m-%d %H:%M')
              })
              print(f"✅ Aktualizovaný: {email}")
          else:
              users.append({
                  'email': email, 'typ_org': typ_org,
                  'oblasti': oblasti, 'kw_custom': kw_custom,
                  'interval': interval,
                  'registracia': datetime.now().strftime('%Y-%m-%d %H:%M'),
                  'updated': datetime.now().strftime('%Y-%m-%d %H:%M'),
              })
              print(f"✅ Nový užívateľ: {email}")

          with open(SUBOR, 'w') as f:
              json.dump(users, f, indent=2, ensure_ascii=False)
          PYEOF
        env:
          INPUT_EMAIL:     ${{ github.event.inputs.email }}
          INPUT_TYP_ORG:   ${{ github.event.inputs.typ_org }}
          INPUT_OBLASTI:   ${{ github.event.inputs.oblasti }}
          INPUT_KW_CUSTOM: ${{ github.event.inputs.kw_custom }}
          INPUT_INTERVAL:  ${{ github.event.inputs.interval }}

      - name: Save users.json
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add users.json
          git commit -m "register user [skip ci]" || echo "nothing to commit"
          git push

      - name: Send welcome email
        run: |
          python3 << 'PYEOF'
          import json, os, smtplib
          from datetime import datetime
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          EMAIL_ODOSIELATEL = "mecasysdata@gmail.com"
          EMAIL_HESLO       = os.environ['EMAIL_HESLO']
          email     = os.environ['INPUT_EMAIL'].strip().lower()
          typ_org   = os.environ['INPUT_TYP_ORG']
          oblasti   = json.loads(os.environ['INPUT_OBLASTI'])
          interval  = os.environ['INPUT_INTERVAL']

          oblasti_str = ', '.join(oblasti)
          interval_sk = {
              'pondelok': 'každý pondelok / every Monday',
              'streda+pondelok': '2× týždenne / twice a week',
              'denne': 'denne / daily'
          }.get(interval, interval)

          html = f"""
          <html><body style="font-family:Arial,sans-serif;max-width:780px;margin:auto;padding:24px;">
            <div style="background:#1a2340;color:#fff;padding:20px 24px;border-radius:8px 8px 0 0;">
              <h1 style="margin:0;font-size:22px;">👋 Vitajte v EuLooker!</h1>
              <p style="margin:6px 0 0;font-size:14px;opacity:.85;">Welcome to EuLooker!</p>
            </div>
            <div style="border:1px solid #dde3ea;border-top:none;padding:24px;border-radius:0 0 8px 8px;">

              <p style="font-size:15px;margin-bottom:12px;">
                Váš monitoring EU výziev bol úspešne aktivovaný! 🎉
              </p>
              <p style="font-size:13px;color:#555;margin-bottom:6px;">
                <b>Typ organizácie:</b> {typ_org}
              </p>
              <p style="font-size:13px;color:#555;margin-bottom:6px;">
                <b>Oblasti záujmu:</b> {oblasti_str}
              </p>
              <p style="font-size:13px;color:#555;margin-bottom:20px;">
                <b>Interval:</b> {interval_sk}
              </p>
              <p style="font-size:14px;color:#1a2340;background:#E1F5EE;padding:12px 16px;border-radius:8px;margin-bottom:20px;">
                ⏳ O niekoľko minút dostanete druhý email s výzvami za posledných 90 dní relevantných pre váš profil.
              </p>

              <hr style="border:none;border-top:1px solid #e0e6ef;margin:20px 0;">

              <p style="font-size:15px;margin-bottom:12px;">
                Your EU grants monitoring has been successfully activated! 🎉
              </p>
              <p style="font-size:13px;color:#555;margin-bottom:6px;">
                <b>Organisation type:</b> {typ_org}
              </p>
              <p style="font-size:13px;color:#555;margin-bottom:6px;">
                <b>Areas of interest:</b> {oblasti_str}
              </p>
              <p style="font-size:13px;color:#555;margin-bottom:20px;">
                <b>Frequency:</b> {interval_sk}
              </p>
              <p style="font-size:14px;color:#1a2340;background:#E1F5EE;padding:12px 16px;border-radius:8px;margin-bottom:20px;">
                ⏳ In a few minutes you will receive a second email with calls from the last 90 days relevant to your profile.
              </p>

              <hr style="border:none;border-top:1px solid #e0e6ef;margin:20px 0 12px;">
              <p style="font-size:12px;color:#888;">
                EuLooker · MecaSys ·
                <a href="https://mecasysdata.github.io/EuLooker" style="color:#1565c0;">mecasysdata.github.io/EuLooker</a>
              </p>
            </div>
          </body></html>"""

          msg = MIMEMultipart("alternative")
          msg["Subject"] = "EuLooker – Vitajte! / Welcome!"
          msg["From"]    = EMAIL_ODOSIELATEL
          msg["To"]      = email
          msg.attach(MIMEText(html, "html", "utf-8"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(EMAIL_ODOSIELATEL, EMAIL_HESLO)
              s.sendmail(EMAIL_ODOSIELATEL, email, msg.as_string())
          print(f"✅ Uvítací email odoslaný na {email}")
          PYEOF
        env:
          INPUT_EMAIL:     ${{ github.event.inputs.email }}
          INPUT_TYP_ORG:   ${{ github.event.inputs.typ_org }}
          INPUT_OBLASTI:   ${{ github.event.inputs.oblasti }}
          INPUT_INTERVAL:  ${{ github.event.inputs.interval }}
          EMAIL_HESLO:     ${{ secrets.EMAIL_HESLO }}

      - name: Search calls (last 90 days) and send results
        run: |
          python3 << 'PYEOF'
          import json, os, re, time, smtplib
          from datetime import datetime
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          import requests

          EMAIL_ODOSIELATEL = "mecasysdata@gmail.com"
          EMAIL_HESLO       = os.environ['EMAIL_HESLO']
          email     = os.environ['INPUT_EMAIL'].strip().lower()
          typ_org   = os.environ['INPUT_TYP_ORG']
          oblasti   = json.loads(os.environ['INPUT_OBLASTI'])
          kw_custom = json.loads(os.environ['INPUT_KW_CUSTOM'])
          interval  = os.environ['INPUT_INTERVAL']

          TYPY_ORG_KW = {
              'SME': ['sme','small and medium','smes','eic accelerator','cascade financing','for smes'],
              'Veľký podnik': ['large enterprise','large company','large industry','for-profit','private company'],
              'Vysoká škola / HEI': ['higher education','university','academic institution','hei','academia'],
              'Výskumná org. (RTO)': ['research organisation','research organization','research center','rto','research institute'],
              'Verejný sektor': ['public body','public authority','municipality','local authority','public administration'],
              'NGO / Asociácia / Klaster': ['non-governmental','ngo','association','cluster','foundation','civil society'],
              'Startup / Spin-off': ['startup','start-up','spin-off','spin-out','deep tech','eic pathfinder','scaleup'],
              'Medzinárodná org.': ['international organisation','international organization','intergovernmental','multilateral'],
          }

          OBLASTI_KW = {
              'Strojárstvo / Industry 4.0': ['industry 4.0','industry 5.0','advanced manufacturing','smart factory','digital twin','industrial automation','cobots','additive manufacturing','3d printing','industrial iot','made in europe','factory of the future'],
              'AI / Robotika / Deep Tech': ['artificial intelligence','machine learning','robotics','autonomous systems','deep learning','generative ai','computer vision','edge computing','quantum computing','apply ai'],
              'Zelená energia / Klíma': ['renewable energy','green hydrogen','carbon capture','energy storage','solar energy','wind energy','net zero','decarbonisation','energy efficiency','smart grid','clean energy'],
              'Agro / Bio / Circular': ['precision agriculture','smart farming','bioeconomy','bio-based','biodegradable','sustainable packaging','soil health','microbiome','agritech','biomaterial'],
              'Zdravie / Medicína / Biotech': ['medical device','diagnostics','drug development','clinical trial','personalised medicine','digital health','cancer research','biotechnology','antimicrobial','genomics'],
              'Obrana / Bezpečnosť / Drony': ['drone','uav','unmanned','defence','dual-use','counter-drone','border surveillance','cbrn','naval','underwater','security technology','swarm'],
              'Vesmír / Space Tech': ['satellite','earth observation','space exploration','copernicus','galileo','new space','remote sensing','space transportation'],
              'Mobilita / Doprava / Smart City': ['electric vehicle','autonomous driving','urban mobility','smart city','zero emission vehicle','battery technology','hydrogen vehicle','sustainable transport'],
              'Voda / Oceány / Životné prostredie': ['water purification','ocean cleaning','marine litter','water quality','blue economy','wastewater','aquaculture','desalination'],
              'Vzdelávanie / Sociálna inovácia': ['education technology','vocational training','digital skills','social innovation','edtech','reskilling','upskilling','vocational excellence'],
          }

          PROGRAMME_MAP = {
              '43108390': 'Horizon Europe', '44181033': 'EDF', '43152860': 'Digital Europe',
              '43252405': 'LIFE', '43251567': 'CEF Energy', '43251589': 'CERV',
              '43252368': 'ISF', '43252476': 'SMP / COSME', '43252517': 'ESF+',
              '43298916': 'Euratom', '43353764': 'Erasmus+', '43637601': 'PPPA',
              '44416173': 'Interreg / I3',
          }

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}

          def _strip_html(text):
              text = re.sub(r'<[^>]+>', ' ', text or '')
              return re.sub(r'\s+', ' ', text).strip()

          def _skrat(text, vety=4):
              if not text or len(text) < 40: return text or '—'
              sents = re.split(r'(?<=[.!?])\s+', text.strip())
              sents = [s.strip() for s in sents if len(s.strip()) > 20]
              if not sents: return (text[:500] + '…') if len(text) > 500 else text
              r = ' '.join(sents[:vety])
              return (r[:800] + '…') if len(r) > 800 else r

          def _obsahuje(text, slova):
              t = text.lower()
              for w in slova:
                  if len(w.split()) > 1:
                      if w in t: return True
                  else:
                      if re.search(r'\b' + re.escape(w) + r'\b', t): return True
              return False

          def _najdi(text, slova):
              t = text.lower()
              found = []
              for w in slova:
                  if len(w.split()) > 1:
                      if w in t: found.append(w)
                  else:
                      if re.search(r'\b' + re.escape(w) + r'\b', t): found.append(w)
              return found

          def hladaj_kw(slovo, page=1):
              url = f"https://api.tech.ec.europa.eu/search-api/prod/rest/search?apiKey=SEDIA&text={slovo}&pageSize=50&pageNumber={page}"
              files = {
                  "sort": (None, json.dumps({"order": "DESC", "field": "startDate"}), "application/json"),
                  "query": (None, json.dumps({"bool": {"must": [
                      {"terms": {"type": ["1","2","8"]}},
                      {"terms": {"status": ["31094501","31094502"]}}
                  ]}}), "application/json"),
                  "languages": (None, json.dumps(["en"]), "application/json"),
              }
              r = requests.post(url, files=files, headers=HEADERS, timeout=30)
              return r.json()

          def ziskaj_detail(identifier):
              url = f"https://ec.europa.eu/info/funding-tenders/opportunities/data/topicDetails/{identifier.lower()}.json"
              try:
                  r = requests.get(url, headers=HEADERS, timeout=15)
                  if r.status_code == 200: return r.json().get('TopicDetails', {})
              except: pass
              return {}

          # Zozbieraj KW
          typ_org_kw  = TYPY_ORG_KW.get(typ_org, [])
          oblast_kw_all = []
          vsetky_search_kw = []

          for o in oblasti:
              for nazov, kw_list in OBLASTI_KW.items():
                  if nazov in o:
                      oblast_kw_all.extend(kw_list)
                      vsetky_search_kw.extend(kw_list)
                      break

          # Pridaj vlastné KW
          oblast_kw_all.extend(kw_custom)
          vsetky_search_kw.extend(kw_custom)
          vsetky_search_kw.extend(typ_org_kw[:3])
          vsetky_search_kw = list(set(vsetky_search_kw))

          print(f"🔍 Hľadám výzvy za posledných 90 dní pre {email} ...")
          print(f"   KW na hľadanie: {len(vsetky_search_kw)}")

          # Stiahni výzvy
          vsetky_raw = {}
          for slovo in vsetky_search_kw:
              try:
                  data = hladaj_kw(slovo)
                  total = data.get('totalResults', 0)
                  pages = min((total + 49) // 50, 3)  # max 3 strany na KW
                  for page in range(1, pages + 1):
                      if page > 1:
                          data = hladaj_kw(slovo, page)
                      for hit in data.get('results', []):
                          ident = hit['metadata']['identifier'][0]
                          if ident not in vsetky_raw:
                              vsetky_raw[ident] = hit
                  time.sleep(0.3)
              except Exception as e:
                  print(f"  ⚠️ Chyba pri '{slovo}': {e}")

          print(f"   Stiahnutých výziev: {len(vsetky_raw)}")

          # Klasifikuj s AND filtrom
          vysledky = []
          for ident, hit in list(vsetky_raw.items()):
              detail = ziskaj_detail(ident)
              if not detail:
                  time.sleep(0.2)
                  continue
              nazov = hit.get('summary', '')
              popis = _strip_html(detail.get('description', ''))
              ft    = f"{nazov} {popis}".lower()

              ma_oblast = _obsahuje(ft, oblast_kw_all)
              ma_org    = _obsahuje(ft, typ_org_kw) if typ_org_kw else True

              if ma_oblast and ma_org:
                  meta     = hit['metadata']
                  prog_raw = meta.get('frameworkProgramme', [''])[0]
                  vysledky.append({
                      'nazov'    : nazov,
                      'programme': PROGRAMME_MAP.get(str(prog_raw), str(prog_raw)),
                      'status'   : meta.get('status', [''])[0],
                      'startDate': meta.get('startDate', [''])[0][:10],
                      'deadline' : meta.get('deadlineDate', [''])[0][:10],
                      'zhrnutie' : _skrat(popis, 4),
                      'link'     : meta.get('url', [''])[0],
                      'kw'       : _najdi(ft, oblast_kw_all)[:4],
                  })
              time.sleep(0.3)

          print(f"   Relevantných výziev: {len(vysledky)}")

          # Pošli email s výsledkami
          oblasti_str = ', '.join(oblasti)
          interval_sk = {
              'pondelok': 'každý pondelok / every Monday',
              'streda+pondelok': '2× týždenne / twice a week',
              'denne': 'denne / daily'
          }.get(interval, interval)
          datum = datetime.now().strftime("%d. %m. %Y")

          if not vysledky:
              predmet = f"EuLooker – Výzvy za posledných 90 dní / Calls from last 90 days"
              html = f"""
              <html><body style="font-family:Arial,sans-serif;max-width:780px;margin:auto;padding:24px;">
                <div style="background:#1a2340;color:#fff;padding:20px 24px;border-radius:8px 8px 0 0;">
                  <h1 style="margin:0;font-size:20px;">📢 EuLooker – {datum}</h1>
                  <p style="margin:6px 0 0;font-size:14px;opacity:.85;">Výzvy za posledných 90 dní / Calls from last 90 days</p>
                </div>
                <div style="border:1px solid #dde3ea;border-top:none;padding:24px;border-radius:0 0 8px 8px;">
                  <p style="font-size:14px;margin-bottom:8px;">
                    Pre váš profil (<b>{typ_org}</b> · {oblasti_str}) sme nenašli žiadne aktuálne výzvy.
                  </p>
                  <p style="font-size:14px;color:#555;margin-bottom:20px;">
                    Ďalší prehľad dostanete <b>{interval_sk}</b>.
                  </p>
                  <hr style="border:none;border-top:1px solid #e0e6ef;margin:20px 0;">
                  <p style="font-size:14px;margin-bottom:8px;">
                    No current calls found for your profile (<b>{typ_org}</b> · {oblasti_str}).
                  </p>
                  <p style="font-size:14px;color:#555;">
                    Next update: <b>{interval_sk}</b>.
                  </p>
                  <hr style="border:none;border-top:1px solid #e0e6ef;margin:20px 0 12px;">
                  <p style="font-size:12px;color:#888;">EuLooker · MecaSys</p>
                </div>
              </body></html>"""
          else:
              predmet = f"EuLooker – {len(vysledky)} výziev za 90 dní / {len(vysledky)} calls from 90 days"
              bloky = ""
              for v in vysledky:
                  kw_text = ", ".join(v['kw']) if v['kw'] else "—"
                  status_label = "🟢 Otvorená / Open" if v['status'] == "31094502" else "🟡 Pripravovaná / Forthcoming"
                  bloky += f"""
                  <div style="border:1px solid #dde3ea;border-radius:8px;padding:16px 20px;margin-bottom:16px;background:#fafbfc;">
                    <h3 style="margin:0 0 6px;color:#1a2340;font-size:14px;">{v['nazov']}</h3>
                    <p style="margin:0 0 6px;font-size:12px;color:#555;">
                      <b>Program:</b> {v['programme']} &nbsp;|&nbsp;
                      {status_label} &nbsp;|&nbsp;
                      <b>Otvorenie / Opens:</b> {v['startDate']} &nbsp;|&nbsp;
                      <b>Uzávierka / Deadline:</b> {v['deadline']}
                    </p>
                    <p style="margin:0 0 6px;font-size:13px;color:#333;line-height:1.5;">{v['zhrnutie']}</p>
                    <p style="margin:0 0 4px;font-size:11px;color:#777;"><b>KW:</b> {kw_text}</p>
                    <a href="{v['link']}" style="color:#1565c0;font-size:12px;">🔗 {v['link']}</a>
                  </div>"""

              html = f"""
              <html><body style="font-family:Arial,sans-serif;max-width:780px;margin:auto;padding:24px;">
                <div style="background:#1a2340;color:#fff;padding:20px 24px;border-radius:8px 8px 0 0;">
                  <h1 style="margin:0;font-size:20px;">📢 EuLooker – {datum}</h1>
                  <p style="margin:6px 0 0;font-size:14px;opacity:.85;">
                    {len(vysledky)} výziev za posledných 90 dní · {len(vysledky)} calls from last 90 days
                  </p>
                </div>
                <div style="border:1px solid #dde3ea;border-top:none;padding:24px;border-radius:0 0 8px 8px;">
                  <p style="font-size:13px;color:#555;margin-bottom:20px;">
                    <b>Typ org.:</b> {typ_org} &nbsp;·&nbsp;
                    <b>Oblasti / Areas:</b> {oblasti_str} &nbsp;·&nbsp;
                    <b>Interval:</b> {interval_sk}
                  </p>
                  {bloky}
                  <hr style="border:none;border-top:1px solid #e0e6ef;margin:24px 0 12px;">
                  <p style="font-size:12px;color:#888;">
                    EuLooker · MecaSys ·
                    <a href="https://mecasysdata.github.io/EuLooker" style="color:#1565c0;">mecasysdata.github.io/EuLooker</a>
                  </p>
                </div>
              </body></html>"""

          msg = MIMEMultipart("alternative")
          msg["Subject"] = predmet
          msg["From"]    = EMAIL_ODOSIELATEL
          msg["To"]      = email
          msg.attach(MIMEText(html, "html", "utf-8"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(EMAIL_ODOSIELATEL, EMAIL_HESLO)
              s.sendmail(EMAIL_ODOSIELATEL, email, msg.as_string())
          print(f"✅ Email s výsledkami odoslaný na {email}")
          PYEOF
        env:
          INPUT_EMAIL:     ${{ github.event.inputs.email }}
          INPUT_TYP_ORG:   ${{ github.event.inputs.typ_org }}
          INPUT_OBLASTI:   ${{ github.event.inputs.oblasti }}
          INPUT_KW_CUSTOM: ${{ github.event.inputs.kw_custom }}
          INPUT_INTERVAL:  ${{ github.event.inputs.interval }}
          EMAIL_HESLO:     ${{ secrets.EMAIL_HESLO }}
